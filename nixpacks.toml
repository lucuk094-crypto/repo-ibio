[phases.setup]
nixPkgs = ["php81", "php81Extensions.mbstring", "php81Extensions.pdo", "php81Extensions.pdo_mysql", "php81Extensions.tokenizer", "php81Extensions.xml", "php81Extensions.ctype", "php81Extensions.json", "php81Extensions.bcmath", "php81Extensions.fileinfo", "php81Extensions.gd", "nodejs-18_x", "nginx"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev",
  "npm install",
  "npm run production"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link && php-fpm -y /etc/php/8.1/fpm/php-fpm.conf -F & nginx -g 'daemon off;'"
